SETTING_PORTAL_LOAD                 = 1             # Whether to load saved portals data of the current map
SETTING_PORTAL_CHECK                = 10.0          # Maximum selection distance when checking nearby portals
SETTING_PORTAL_TASK                 = 0.1           # Time interval in seconds to check for portals and apply their effects
SETTING_OFFSET_BASE                 = 120.0         # Default forward offset when previewing portal placement
SETTING_OFFSET                      = 65.0 900.0    # Default minimum and maximum offset from the player to the portal (MIN MAX)
