SETTING_DEFAULT_ACTIVE_COOLDOWN     = 5.0 5.0
SETTING_DEFAULT_SPRITE_FRAMERATE    = 10.0
SETTING_DEFAULT_SPRITE_OFFSET       = 50.0
SETTING_DEFAULT_SPRITE_SCALE        = 0.75
SETTING_DEFAULT_SPRITE_COLOR        = 255 255 255
